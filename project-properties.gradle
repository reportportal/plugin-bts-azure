java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

def commonScriptsUrl = 'https://raw.githubusercontent.com/reportportal/gradle-scripts/'

project.ext {
    publishRepo = "https://maven.pkg.github.com/reportportal/plugin-bts-azure"
    dependencyRepos = ["plugin-api", "commons-bom"]
    releaseMode = project.hasProperty("releaseMode")
    pluginsDir = layout.buildDirectory.dir("plugins").get().asFile.path
    scriptsUrl = commonScriptsUrl + (releaseMode ? getProperty('scripts.version') : 'EPMRPP-111932-java-25')
    excludeTests = [
            '**/entity/**'
    ]
    limits = [
            'instruction': 10,
            'branch'     : 3,
            'line'       : 10,
            'complexity' : 8,
            'method'     : 10,
            'class'      : 10
    ]
}

wrapper {
    gradleVersion = '9.3.1'
}
